name: Build and publish all Android APKs

# Builds the four Android apps and publishes them to the "latest-apks" release:
#   GgnHome.apk        GgnHome (opens https://www.ggnhome.com, and every ggnhome.com link tapped on the phone)
#   GgnHome-Partner.apk  Partner portal  (https://www.ggnhome.com/partner/dashboard)
#   GgnHome-Admin.apk    Admin portal    (https://www.ggnhome.com/admin/login)
#   sms-service.apk      SMS gateway and OTP viewer
# The website serves them at /api/app-downloads/<file> and lists them on /apps and /doc.
#
# Signing: set the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD (create them once with mobile/tools/make-keystore.sh). Without them the APKs are
# signed with a cached debug key, which installs but may change, and then Android cannot verify the links.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-all-apks.yml"
      - "mobile/**"
      - "sms-gateway-app/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-all-apks
  cancel-in-progress: false

jobs:
  build:
    name: Build GgnHome, Partner, Admin and SMS APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SMS_KEY: ${{ secrets.SMS_KEY }}
      SMS_GGNHOME_URL: ${{ secrets.SMS_GGNHOME_URL }}
      SMS_SHINE_URL: ${{ secrets.SMS_SHINE_URL }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Gradle for SMS Service
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---- signing -------------------------------------------------------------------------------------
      - name: Use the release signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ggnhome-release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/ggnhome-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEYSTORE_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEYSTORE_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: No release key, so keep one debug key between runs
        if: ${{ env.KEYSTORE_B64 == '' }}
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ggnhome-debug-keystore-v1

      - name: Warn about missing secrets
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning title=Release signing key missing::APKs are debug-signed. Run mobile/tools/make-keystore.sh and add the four ANDROID_* secrets so every build has the same signature."; fi
          if [ -z "$SMS_KEY" ]; then echo "::warning title=SMS_KEY missing::The SMS Service APK falls back to the test key and will not authenticate against the production servers. Add the SMS_KEY secret."; fi

      # ---- app wrappers --------------------------------------------------------------------------------
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          mkdir -p www

      # Push notifications need Firebase. Add the secret GOOGLE_SERVICES_JSON (the google-services.json of a
      # Firebase project that has all three app ids). Without it the apps run fine but never ask for or
      # register for push, because registering without Firebase crashes the app.
      - name: Firebase config for push notifications (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            sed -i 's#GgnHomeApp/1.0.0#GgnHomeApp/1.0.0 GgnHomePush#' mobile/capacitor.config.json
            echo "Push notifications are ON in the apps."
          else
            echo "::warning title=Push notifications off::GOOGLE_SERVICES_JSON secret is missing, so the apps do not ask for or use push notifications."
          fi

      - name: Make the Partner and Admin wrappers
        run: |
          rm -rf partner-build admin-build
          cp -R mobile partner-build
          cp -R mobile admin-build
          node mobile/tools/make-variant.js partner-build com.tanush.ggnhomepartner "GgnHome Partner" https://www.ggnhome.com/partner/dashboard
          node mobile/tools/make-variant.js admin-build com.tanush.ggnhomeadmin "GgnHome Admin" https://www.ggnhome.com/admin/login

      - name: Sync the web shell into all three wrappers
        run: |
          for dir in mobile partner-build admin-build; do
            (cd "$dir" && npx cap sync android)
          done

      - name: Build GgnHome APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../dist-apks
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apks/GgnHome.apk

      - name: Build GgnHome Partner APK
        working-directory: partner-build/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apks/GgnHome-Partner.apk

      - name: Build GgnHome Admin APK
        working-directory: admin-build/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apks/GgnHome-Admin.apk

      - name: Build SMS Service APK
        working-directory: sms-gateway-app
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../dist-apks/sms-service.apk

      # ---- checks --------------------------------------------------------------------------------------
      - name: Check the signatures, versions and ggnhome.com link verification
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "## Android APKs"
            echo
            echo "| App | Package | Version | Signing certificate SHA-256 |"
            echo "|---|---|---|---|"
          } > "$GITHUB_STEP_SUMMARY"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          LINK_FP=""
          for apk in dist-apks/*.apk; do
            "$APKSIGNER" verify "$apk"
            hex=$("$APKSIGNER" verify --print-certs "$apk" | grep -m1 "certificate SHA-256 digest" | awk '{print $NF}')
            fp=$(echo "$hex" | sed 's/../&:/g; s/:$//' | tr a-f A-F)
            pkg=$("$AAPT" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*versionName='\([^']*\)'.*/\1/p")
            ver=$("$AAPT" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*versionName='\([^']*\)'.*/\2/p")
            echo "| $(basename "$apk") | $pkg | $ver | \`$fp\` |" >> "$GITHUB_STEP_SUMMARY"
            [ "$(basename "$apk")" = "GgnHome.apk" ] && LINK_FP="$fp"
          done
          if grep -qi "$LINK_FP" client/public/.well-known/assetlinks.json; then
            echo "Link verification: GgnHome.apk is signed with a key listed in assetlinks.json. ggnhome.com links open in the app."
            echo -e "\nLink verification: OK, ggnhome.com links open directly in the app." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=ggnhome.com links will not open in the app::Add $LINK_FP to sha256_cert_fingerprints in client/public/.well-known/assetlinks.json and deploy the website."
            echo -e "\n**Link verification: NOT YET.** Add \`$LINK_FP\` to \`sha256_cert_fingerprints\` in \`client/public/.well-known/assetlinks.json\` and deploy the website, so Android opens ggnhome.com links in the app." >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd dist-apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload all APKs as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggnHome-android-apks
          path: dist-apks/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs as GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apks
          name: Latest Android APKs (1.0.0)
          body: |
            GgnHome 1.0.0. Automatically built APKs, replaced whenever this workflow runs successfully.

            | File | App |
            |---|---|
            | GgnHome.apk | GgnHome: search, rent and buy property |
            | GgnHome-Partner.apk | GgnHome Partner portal |
            | GgnHome-Admin.apk | GgnHome Admin portal |
            | sms-service.apk | SMS Service: gateway and OTP viewer |

            Download them from https://www.ggnhome.com/apps. SHA256SUMS.txt lists the checksum of each file.
          make_latest: true
          files: |
            dist-apks/GgnHome.apk
            dist-apks/GgnHome-Partner.apk
            dist-apks/GgnHome-Admin.apk
            dist-apks/sms-service.apk
            dist-apks/SHA256SUMS.txt
          overwrite_files: true
          fail_on_unmatched_files: true
