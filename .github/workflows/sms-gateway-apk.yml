name: Build SMS Service APK

on:
  push:
    branches: [main]
    paths:
      - "sms-gateway-app/**"
      - ".github/workflows/sms-gateway-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sms-gateway-app
    env:
      # Optional: set these repo secrets to also publish to Firebase App Distribution.
      # The one shared key baked into the app; it must equal SMS_KEY on both servers.
      SMS_KEY: ${{ secrets.SMS_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_HOME).

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sms-service.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-service-apk
          path: sms-gateway-app/app/build/outputs/apk/release/sms-service.apk

      - name: Distribute via Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
          file: sms-gateway-app/app/build/outputs/apk/release/sms-service.apk
          releaseNotes: "SMS Service build ${{ github.sha }}"
