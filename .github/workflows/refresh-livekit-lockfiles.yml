name: Refresh LiveKit dependency lockfiles

on:
  pull_request:
    branches:
      - main
    paths:
      - client/package.json
      - server/package.json
      - .github/workflows/refresh-livekit-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- client/package-lock.json server/package-lock.json; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json server/package-lock.json
          git commit -m "chore: refresh LiveKit dependency lockfiles"
          git push origin HEAD:${{ github.ref_name }}
