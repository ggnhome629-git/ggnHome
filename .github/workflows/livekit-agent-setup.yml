name: LiveKit Agent Setup

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Use create only for first setup; deploy after livekit.toml is merged"
        required: true
        type: choice
        options:
          - create
          - deploy
        default: create

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: livekit-agent-setup
  cancel-in-progress: false

jobs:
  create-agent:
    if: inputs.operation == 'create'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and deploy LiveKit Cloud agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: create
          WORKING_DIRECTORY: services/livekit-agent

      - name: Open PR for generated LiveKit config
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: services/livekit-agent/livekit.toml
          branch: livekit-agent-config
          delete-branch: false
          title: "Add LiveKit Cloud agent configuration"
          commit-message: "Add LiveKit Cloud agent configuration"
          body: "Adds the livekit.toml generated by LiveKit Cloud agent creation. Review and merge this file to enable future deployments."
          base: main

  deploy-agent:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required agent files
        shell: bash
        run: |
          test -f services/livekit-agent/livekit.toml || { echo "::error::services/livekit-agent/livekit.toml is missing. Run the create operation first and merge its config PR."; exit 1; }
          test -f services/livekit-agent/Dockerfile || { echo "::error::Dockerfile is missing."; exit 1; }

      - name: Deploy LiveKit Cloud agent
        uses: livekit/deploy-action@v2.12.2
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          SECRET_LIST: ${{ secrets.SECRET_LIST }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: services/livekit-agent
