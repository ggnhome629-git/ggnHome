name: Client UI Build

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/client-ui-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/client-ui-build.yml"

permissions:
  contents: write

jobs:
  build-client:
    name: Build web and mobile-web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Refresh and export LiveKit lockfiles (temporary PR validation)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix client
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix server
      - name: Upload refreshed lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: livekit-lockfiles
          path: |
            client/package-lock.json
            server/package-lock.json
          if-no-files-found: error
      - name: Commit refreshed lockfiles to PR branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /tmp/ggnhome-livekit-locks/client /tmp/ggnhome-livekit-locks/server
          cp client/package-lock.json /tmp/ggnhome-livekit-locks/client/package-lock.json
          cp server/package-lock.json /tmp/ggnhome-livekit-locks/server/package-lock.json
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout -B "${GITHUB_HEAD_REF}" FETCH_HEAD
          cp /tmp/ggnhome-livekit-locks/client/package-lock.json client/package-lock.json
          cp /tmp/ggnhome-livekit-locks/server/package-lock.json server/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
          else
            git commit -m "chore: refresh LiveKit dependency lockfiles"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
      - name: Install dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build responsive client
        working-directory: client
        env:
          CI: "false"
        run: npm run build

      - name: Install server dependencies
        run: npm ci --prefix server --no-audit --no-fund
      - name: Check server and access-control syntax
        run: |
          node --check server/services/smartNotifications.js
          node --check server/Route/appRoutes.js
          node --check server/Route/route.js
          node --check server/index.js
          node --check server/controllers/adminPartnerAccess.controller.js
          node --check server/controllers/adminDashboardPreferences.controller.js
          node --check server/controllers/appDownload.controller.js
          node --check server/controllers/partnerAuth.controller.js
          node --check server/models/AdminDashboardPreferences.model.js
      - name: Validate notification templates
        run: node server/scripts/validate-notification-templates.js
