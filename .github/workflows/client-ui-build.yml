name: Client UI Build

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "client/**"
      - ".github/workflows/client-ui-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-ui-build.yml"

permissions:
  contents: read

jobs:
  build-client:
    name: Build web and mobile-web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Build responsive client
        working-directory: client
        env:
          CI: "false"
        run: npm run build
