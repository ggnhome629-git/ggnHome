plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ggnhome.smsgateway'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ggnhome.smsgateway'
        minSdk 24
        targetSdk 34
        // 1.0.0 is the first public release; versionCode only goes up so phones with an earlier build can update.
        versionCode 5
        versionName '1.0.0'

        // Addresses of the two servers and the ONE shared SMS_KEY (the GitHub build reads it from the SMS_KEY repo
        // secret; the 'test123' default only works against a non-production server).
        buildConfigField 'String', 'GGNHOME_URL', "\"${System.getenv('SMS_GGNHOME_URL') ?: 'https://api.ggnhome.com'}\""
        buildConfigField 'String', 'GGNHOME_KEY', "\"${System.getenv('SMS_KEY') ?: 'test123'}\""
        buildConfigField 'String', 'SHINE_URL', "\"${System.getenv('SMS_SHINE_URL') ?: 'https://we-three-api.onrender.com'}\""
        buildConfigField 'String', 'SHINE_KEY', "\"${System.getenv('SMS_KEY') ?: 'test123'}\""
    }

    // One key signs every APK: the release key from the build's secrets when it has one (stable updates and
    // verified ggnhome.com links), otherwise the debug key so the APK still installs.
    signingConfigs {
        ggnhome {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        // Signed with the release key when the build has it, otherwise with the debug key so the APK still installs.
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE_FILE") ? signingConfigs.ggnhome : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Intentionally no third-party dependencies: only the Android framework.
