services:
  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit/livekit.yaml"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml:ro

  stt:
    profiles: [local-speech]
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    network_mode: host
    restart: unless-stopped
    environment:
      WHISPER__MODEL: Systran/faster-whisper-small
    volumes:
      - stt_cache:/home/ubuntu/.cache/huggingface/hub

  tts:
    profiles: [local-speech]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    network_mode: host
    restart: unless-stopped

  agent:
    build:
      context: ../../services/livekit-agent
    network_mode: host
    env_file:
      - ../../services/livekit-agent/.env
    restart: unless-stopped
    depends_on:
      - livekit

  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Set LIVEKIT_DOMAIN to a DNS hostname pointing to this VM}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit

volumes:
  caddy_data:
  caddy_config:
  stt_cache:
