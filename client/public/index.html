  <body>
    <!-- Static boot screen: matches the animated launch intro so there is no
         white flash while the JS bundle downloads on slow phones/networks.
         Only shown when the intro will play; AppLaunchIntro removes it. -->
    <style>
      #ggn-boot{position:fixed;inset:0;z-index:19999;display:none;flex-direction:column;align-items:center;justify-content:center;background:#002244;font-family:system-ui,-apple-system,Roboto,sans-serif}
      #ggn-boot .t{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;box-shadow:0 16px 40px rgba(0,0,0,.25)}
      #ggn-boot .s{position:absolute;bottom:calc(56px + env(safe-area-inset-bottom));color:#E6FBFD;font-size:14px;font-weight:600}
      #ggn-boot .b{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
      #ggn-boot .b i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#00A79D,#22D3EE);animation:ggnbar 1.4s ease-in-out infinite}
      @keyframes ggnbar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
    </style>
    <div id="ggn-boot" aria-hidden="true">
      <div class="t"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>
          </div>
    <script>
      (function(){try{var p=location.pathname,ua=navigator.userAgent||"";
        if(p.indexOf("/admin")===0||sessionStorage.getItem("ggn:introSeen"))return;
        if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
        if(/GgnHomeApp/i.test(ua)||p==="/")document.getElementById("ggn-boot").style.display="flex";}catch(e){}})();
    </script>
    <style>
      #ggn-build-status{position:fixed;right:12px;bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:1500;display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 12px;border:1px solid rgba(171,159,255,.58);border-radius:999px;color:#fff;background:linear-gradient(115deg,#4526bc,#782ee8 58%,#b12fcf);box-shadow:0 5px 18px rgba(57,35,145,.28);font:800 12px/1 Inter,system-ui,sans-serif;letter-spacing:.025em;cursor:pointer}
      #ggn-build-status .dot{width:7px;height:7px;border-radius:50%;background:#75dca1;box-shadow:0 0 0 3px rgba(117,220,161,.13)}
      #ggn-build-status.update .dot{background:#ffd166;box-shadow:0 0 0 3px rgba(255,209,102,.16)}
      #ggn-build-status.unavailable .dot{background:#c1ccd9;box-shadow:none}
      #ggn-build-status:focus-visible{outline:3px solid #60f4e7;outline-offset:3px}
      @media(max-width:520px){#ggn-build-status{right:8px;bottom:calc(82px + env(safe-area-inset-bottom,0px));min-height:34px;padding:0 10px}}
    </style>
    <button id="ggn-build-status" class="checking" type="button" aria-label="Check GgnHome frontend version" title="Checking the live frontend version">
      <span aria-hidden="true">✨</span><span class="label">V2 · CHECK</span><span class="dot" aria-hidden="true"></span>
    </button>
    <script>
      (function(){
        var button=document.getElementById("ggn-build-status");
        var meta=document.querySelector('meta[name="ggnhome-frontend-version"]');
        if(!button||!meta)return;
        if(/^\/(admin|partner|agent|sms-service)(\/|$)/i.test(location.pathname)){button.remove();return;}
        var bundle=meta.content||"0.0.0";
        var label=button.querySelector(".label");
        function setState(state,text,title){button.className=state;label.textContent=text;button.title=title;}
        async function check(){
          try{
            var response=await fetch("/version.json?check="+Date.now(),{cache:"no-store",headers:{Accept:"application/json"}});
            if(!response.ok)throw new Error("Version check failed");
            var live=await response.json();
            if(!live||typeof live.version!=="string")throw new Error("Version manifest invalid");
            if(live.version===bundle){
              setState("current","V"+bundle.split(".")[0]+" · LIVE","Frontend bundle v"+bundle+" matches the live version manifest");
            }else{
              setState("update","V"+bundle.split(".")[0]+" · UPDATE","This tab has frontend v"+bundle+"; the server publishes v"+live.version+". Click to clear browser caches and reload.");
            }
          }catch(e){
            setState("unavailable","V"+bundle.split(".")[0]+" · VERIFY","Could not verify the live frontend version. Click to check again.");
          }
        }
        button.addEventListener("click",async function(){
          if(button.className==="update"){
            label.textContent="REFRESHING…";
            var tasks=[];
            try{
              if("caches" in window)tasks.push(caches.keys().then(function(names){return Promise.all(names.map(function(name){return caches.delete(name);}));}));
              if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(reg){return reg.unregister();}));}));
              await Promise.all(tasks);
            }catch(e){}
            window.location.reload();
            return;
          }
          setState("checking","V"+bundle.split(".")[0]+" · CHECK","Checking the live frontend version");
          await check();
        });
        check();
      })();
    </script>
