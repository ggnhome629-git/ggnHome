<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00A79D" />
    <link rel="canonical" href="https://www.ggnhome.com/" />
    <meta
      name="description"
      content="GgnHome — Get Space & Get Rewarded. Register with us, Deal with us & Get Rewarded up to ₹1,000. Search, rent or buy verified properties in Gurgaon. Personalised recommendations and AI-powered search."
    />

    <!-- Open Graph fallback (used by crawlers that load index.html directly) -->
    <meta property="og:locale" content="en_IN" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GgnHome" />
    <meta property="og:title" content="GgnHome — Get Space & Get Rewarded" />
    <meta
      property="og:description"
      content="Register with us, Deal with us & Get Rewarded up to ₹1,000. Personalised recommendations, AI search and easy scheduling. Visit GgnHome now."
    />
    <meta property="og:url" content="https://www.ggnhome.com/" />
    <meta
      property="og:image"
      content="https://www.ggnhome.com/og-image-whatsapp.jpg?v=1"
    />
    <meta
      property="og:image:alt"
      content="GgnHome — Get Space & Get Rewarded"
    />

    <!-- Twitter Card fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GgnHome — Get Space & Get Rewarded" />
    <meta
      name="twitter:description"
      content="Register with us, Deal with us & Get Rewarded up to ₹1,000. Personalised recommendations, AI search and easy scheduling. Visit GgnHome now."
    />
    <meta
      name="twitter:image"
      content="https://www.ggnhome.com/og-image-whatsapp.jpg?v=1"
    />

    <!-- Preload logo for faster LCP -->
    <link rel="preload" href="%PUBLIC_URL%/Logo2.jpg" as="image" />

    <!-- PWA manifest (already present) -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Logo2.jpg" />
    <link rel="icon" type="image/jpeg" href="%PUBLIC_URL%/Logo2.jpg" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>GgnHome</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
